name: Native Assembly projects
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install the required debugger
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdb
      - name: Verify native build, contracts and debugger trace
        run: python3 test/verify_opening.py --cc ${{ matrix.compiler }} --proof output/opening-${{ matrix.compiler }}.json
      - name: Verify native calculator contracts and debugger trace
        run: python3 test/verify_calculator.py --cc ${{ matrix.compiler }} --proof output/calculator-${{ matrix.compiler }}.json
      - name: Verify bounded array contracts and debugger trace
        run: python3 test/verify_array.py --cc ${{ matrix.compiler }} --proof output/array-${{ matrix.compiler }}.json
      - name: Verify bounded string contracts and debugger trace
        run: python3 test/verify_string.py --cc ${{ matrix.compiler }} --proof output/string-${{ matrix.compiler }}.json
      - name: Verify helper invocation, arguments, alignment and debugger trace
        run: python3 test/verify_helper.py --cc ${{ matrix.compiler }} --proof output/helper-${{ matrix.compiler }}.json
      - name: Verify signed parser, command errors and debugger trace
        run: python3 test/verify_parser.py --cc ${{ matrix.compiler }} --proof output/parser-${{ matrix.compiler }}.json
      - name: Verify reverse reconstruction and full-width behavior
        run: python3 test/verify_reverse.py --cc ${{ matrix.compiler }} --proof output/reverse-${{ matrix.compiler }}.json
      - name: Verify nested assembly calls and stack frames
        run: python3 test/verify_stack.py --cc ${{ matrix.compiler }} --proof output/stack-${{ matrix.compiler }}.json
      - name: Verify real compiler output and optimized equivalence
        run: python3 test/verify_compiler.py --cc ${{ matrix.compiler }} --proof output/compiler-${{ matrix.compiler }}.json
      - name: Verify the real branch fault and repaired debugger trace
        run: python3 test/verify_debug.py --cc ${{ matrix.compiler }} --proof output/debug-${{ matrix.compiler }}.json
      - name: Verify equivalent loops, actual timing and access-order evidence
        run: python3 test/verify_performance.py --cc ${{ matrix.compiler }} --proof output/performance-${{ matrix.compiler }}.json
      - name: Verify real stack guards, PIE evidence and runtime traces
        run: python3 test/verify_hardening.py --cc ${{ matrix.compiler }} --proof output/hardening-${{ matrix.compiler }}.json
      - name: Verify machine addresses, load widths and debugger evidence
        run: python3 test/verify_records.py --cc ${{ matrix.compiler }} --proof output/records-${{ matrix.compiler }}.json
      - name: Verify the documented collection build
        if: matrix.compiler == 'clang'
        run: |
          cmake -S . -B "$RUNNER_TEMP/assembly-collection"
          cmake --build "$RUNNER_TEMP/assembly-collection" --parallel 1
      - name: Retain native proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-opening-${{ matrix.compiler }}
          path: output/
          if-no-files-found: error
