name: Native Assembly opening
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify native build, contracts and debugger trace
        run: python3 test/verify_opening.py --cc ${{ matrix.compiler }} --proof output/opening-${{ matrix.compiler }}.json
      - name: Retain native proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-opening-${{ matrix.compiler }}
          path: output/
          if-no-files-found: error
